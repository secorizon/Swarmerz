name: test-and-install

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build the release artifacts
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel
        shell: bash
        run: python -m pip install dist/swarmerz-*.whl
      - name: Verify the installed console command from a clean directory
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          swarmerz --version
          swarmerz doctor --json
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q
